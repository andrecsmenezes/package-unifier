name: V2 adoption preflight (pre-PR)

on:
  push:
    branches:
      - chore/adopt-orchestrator-v2-20261103

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official OpenSpec
        run: npm install --global @fission-ai/openspec@1.14.3 --no-audit --no-fund
      - name: Run pre-PR official strict validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/adoption_preflight.py --root . --cli openspec | tee adoption-preflight-proof.json
      - name: Save preflight evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v2-adoption-preflight-proof
          path: adoption-preflight-proof.json
          if-no-files-found: error
