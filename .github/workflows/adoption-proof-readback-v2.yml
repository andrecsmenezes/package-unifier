name: V2 adoption preflight readback

on:
  push:
    branches:
      - chore/adopt-orchestrator-v2-20261103
    paths:
      - '.github/workflows/adoption-proof-readback-v2.yml'
      - 'openspec/specs/**'
      - 'openspec/config.yaml'
      - 'core/adoption_preflight.py'
      - 'scripts/adoption_preflight.py'

permissions:
  contents: write

concurrency:
  group: package-unifier-v2-adoption-preflight
  cancel-in-progress: false

jobs:
  official-preflight:
    if: github.repository == 'andrecsmenezes/package-unifier' && github.ref == 'refs/heads/chore/adopt-orchestrator-v2-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSPEC_TELEMETRY: '0'
      BASELINE_SHA: '1c30c5fb9b0e1c9abefdeb09f1b33291717dada7'
    steps:
      - name: Read exact candidate SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Assert no changes to application runtime
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASELINE_SHA}^{commit}"
          if git diff --name-only "$BASELINE_SHA" HEAD | grep -E '^(package-unifier\.php$|src/|vendor/|composer\.(json|lock)$)'; then
            echo "Application runtime changed during adoption" >&2
            exit 1
          fi
      - name: Set up official OpenSpec runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.14.3 --no-audit --no-fund
      - name: Generate official strict validation evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/adoption_preflight.py --root . --cli openspec | tee /tmp/package-unifier-preflight.json
      - name: Store official evidence and candidate hash in staging branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads(Path('/tmp/package-unifier-preflight.json').read_text(encoding='utf-8'))
          if proof.get('status') != 'PASS' or proof.get('command') != 'openspec validate --all --strict':
              raise SystemExit('Official strict preflight proof is incomplete')
          proof.update({
              'schema': 'package-unifier-v2-preflight-proof',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_candidate_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
          })
          target = Path('orchestration/preflight-proof.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- orchestration/preflight-proof.json
          git commit -m "ci(adoption): record official strict preflight proof [skip ci]"
          git push origin "HEAD:refs/heads/chore/adopt-orchestrator-v2-20261103"
