name: E001 temporary official skills synchronization
on:
  push:
    branches:
      - feat/v2-e001-s1-canonical-openspec-20261103
    paths:
      - '.github/workflows/e001-official-skills-sync.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official OpenSpec
        run: npm install -g @fission-ai/openspec@1.14.3 --no-audit --no-fund
      - name: Regenerate official skill files
        env:
          OPENSPEC_TELEMETRY: '0'
        run: |
          openspec init --tools codex
          openspec update
          openspec validate --all --strict
      - name: Commit generated skills only
        shell: bash
        run: |
          set -euo pipefail
          git add -- .agents/skills/
          git diff --cached --quiet && { echo "No generated changes detected" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(openspec): restore full CLI-generated skills [skip ci]"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/feat/v2-e001-s1-canonical-openspec-20261103"
