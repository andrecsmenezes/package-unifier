name: runtime-safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-php:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Syntax check
        run: |
          php -l package-unifier.php
          find src -type f -name '*.php' -exec php -l {} \;
          php -l scripts/compare_composer_metadata.php
          php -l scripts/test_offline_composer_metadata.php
      - name: Validate Composer lock consistency
        run: composer validate --no-check-publish --strict
      - name: Verify retained local autoloader is committed
        run: |
          test -f vendor/autoload.php
          git ls-files --error-unmatch vendor/autoload.php
          php -r 'require "vendor/autoload.php"; if (!class_exists("Composer\\InstalledVersions")) { exit(1); }'
      - name: Offline owner-supplied Composer metadata comparison fixtures
        run: php scripts/test_offline_composer_metadata.php
      - name: WordPress bootstrap fixture regression
        run: php scripts/test_wordpress_bootstrap.php
      - name: Fail-closed bootstrap contract
        run: python3 scripts/validate_safe_bootstrap.py
      - name: Reachable mutating-operation guard
        run: python3 scripts/validate_reachable_mutation.py
      - name: Reachable mutation graph regression fixtures
        run: python3 -m unittest scripts.test_reachable_mutation
      - name: Merged-branch deletion guard tests
        run: python3 -m unittest scripts.test_cleanup_merged_branches
